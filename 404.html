<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script src="./config.js"></script>
    <script>
      var GITHUB_ISSUES_LINK = window.PAGE_CONFIG.GITHUB_ISSUES_LINK;
      var VIEWER_BASE_URL = window.PAGE_CONFIG.VIEWER_BASE_URL;
      var VIEWER_PREFIX = window.PAGE_CONFIG.VIEWER_PREFIX;
      var PATH_SEGMENTS_TO_SKIP = 1;

      /**
       * DO NOT TOUCH ANYTHING BELOW THIS COMMENT UNLESS YOU KNOW WHAT YOU ARE DOING
       */

      function isUrl(url) {
        // Regex from https://stackoverflow.com/a/3809435,
        // with a modification to allow for TLDs of up to 24 characters
        return /^https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,24}\b([-a-zA-Z0-9@:%_\+.~#?&//=]*)+$/.test(
          url,
        );
      }

      /**
       * $VIEWER/52
       *      ↓
       * {VIEWER_BASE_URL}?id=52
       */
      function resolveViewerUrl(title) {
        if (!title || title.indexOf(VIEWER_PREFIX) !== 0) {
          return null;
        }

        var id = title.substring(VIEWER_PREFIX.length).trim();

        // 현재 Notion unique_id는 숫자만 허용
        if (!/^\d+$/.test(id)) {
          return null;
        }

        return VIEWER_BASE_URL + "?id=" + encodeURIComponent(id);
      }

      function redirect() {
        var location = window.location;

        var issueNumber =
          location.pathname.split("/")[PATH_SEGMENTS_TO_SKIP + 1];

        var homepage =
          location.protocol +
          "//" +
          location.hostname +
          (location.port ? ":" + location.port : "") +
          "/" +
          location.pathname.split("/")[PATH_SEGMENTS_TO_SKIP];

        var xhr = new XMLHttpRequest();

        xhr.onload = function () {
          try {
            var payload = JSON.parse(xhr.response);

            var message = payload.message;
            var title = payload.title;

            if (message === "Not Found" || !title) {
              location.replace(homepage);
              return;
            }

            title = title.trim();

            /**
             * Labelink Viewer syntax
             *
             * $VIEWER/52
             */
            var viewerUrl = resolveViewerUrl(title);

            if (viewerUrl) {
              location.replace(viewerUrl);
              return;
            }

            /**
             * 기존 URL Shortener 동작
             */
            var url = document.createElement("a");

            url.setAttribute("href", title);

            // Invalid URLs includes:
            // - invalid issue numbers
            // - issue titles that are not URLs
            // - recursive destination URLs
            var isInvalidUrl =
              !isUrl(title) || url.hostname === location.hostname;

            if (isInvalidUrl) {
              location.replace(homepage);
            } else {
              location.replace(title);
            }
          } catch (e) {
            location.replace(homepage);
          }
        };

        xhr.onerror = function () {
          location.replace(homepage);
        };

        xhr.open("GET", GITHUB_ISSUES_LINK + issueNumber);

        xhr.send();
      }

      redirect();
    </script>
  </head>

  <body></body>
</html>
